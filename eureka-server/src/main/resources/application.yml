server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # The registry itself does not register or fetch from anyone
    register-with-eureka: false
    fetch-registry: false
  server:
    # Drop dead instances quickly so the gateway stops routing to them (demo-friendly)
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 3000
