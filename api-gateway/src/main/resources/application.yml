server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: tourist-service
          # lb:// = resolve "tourist-service" through Eureka and load-balance
          uri: lb://tourist-service
          predicates:
            - Path=/api/tourist/**
          filters:
            # If an instance is down or fails, retry on the next instance
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET
                exceptions: java.io.IOException,java.net.ConnectException,org.springframework.cloud.gateway.support.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
    loadbalancer:
      # Default algorithm is round robin. Cache kept short so new/removed instances show up fast.
      cache:
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    com.smarttourism.gateway: INFO
