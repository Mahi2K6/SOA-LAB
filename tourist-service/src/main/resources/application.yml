server:
  # Override per instance: --server.port=8082, --server.port=8083 ...
  port: 8081

spring:
  application:
    # All instances share this name -> Eureka groups them as TOURIST-SERVICE
    name: tourist-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Unique id per instance so Eureka lists them separately
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
